services:
  # ==========================================================
  # Banco de dados — PostgreSQL
  # ==========================================================
  db:
    image: postgres:16
    container_name: financas_db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: financas
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    # Healthcheck: o backend só sobe quando o banco estiver realmente pronto
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d financas"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ==========================================================
  # Backend — API REST (FastAPI)
  # ==========================================================
  backend:
    build: ./backend
    container_name: financas_backend
    restart: always
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/financas
    depends_on:
      db:
        condition: service_healthy

  # ==========================================================
  # Frontend — Interface web (Flask)
  # ==========================================================
  frontend:
    build: ./frontend
    container_name: financas_frontend
    restart: always
    ports:
      - "3000:3000"
    environment:
      API_URL: http://backend:8000/api/v1
    depends_on:
      - backend

volumes:
  postgres_data:
